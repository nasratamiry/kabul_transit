# Kabul Cargo — production stack: MySQL 8.4, Redis, Django (gunicorn), nginx, daily backups.
#
#   Coolify:     add this repository as a "Docker Compose" resource; give the nginx service the
#                domain (port 80). Coolify's proxy does TLS. Variables: see .env.production.example.
#   Plain VPS:   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#                (adds Caddy: ports 80/443 and the Let's Encrypt certificate).
#   Local test:  scripts/prod_local_test.ps1 (adds docker-compose.local.yml; never on a server).
#
# Full guide (Dari): docs/DEPLOY.md

name: kabulcargo

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: kabulcargo_backend.settings_production
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  DB_NAME: ${DB_NAME:-kabulcargo}
  DB_USER: ${DB_USER:-kabulcargo}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_URL: redis://redis:6379/0
  # TLS proxy (Caddy / Coolify's Traefik) → nginx → gunicorn: two hops.
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-2}
  DOCUMENT_X_ACCEL_PREFIX: /protected-media
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  KC_LOCAL_HTTP_TEST: ${KC_LOCAL_HTTP_TEST:-false}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-kabulcargo}
      MYSQL_USER: ${DB_USER:-kabulcargo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Kabul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Only throttle / rate-limit counters: nothing to persist.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  backend:
    build: .
    image: kabulcargo-backend:latest
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - media:/app/media
      - logs:/app/logs
      - backups:/app/backups
      - static:/srv/static
    logging: *logging

  backup:
    image: kabulcargo-backend:latest
    pull_policy: never   # the image the backend service builds
    restart: unless-stopped
    entrypoint: ["/app/deploy/docker/backup-loop.sh"]
    environment:
      <<: *backend-env
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - backups:/app/backups
      - logs:/app/logs
      - media:/app/media:ro
    healthcheck:
      disable: true
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: kabulcargo-nginx:latest
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    expose: ["80"]
    logging: *logging

volumes:
  mysql-data:
  media:
  logs:
  backups:
  static:
