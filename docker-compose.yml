# Kabul Cargo — production stack: MySQL 8.4, Redis, Django (gunicorn), nginx (SPA + proxy).
#
#   Coolify (shared server): add this repository as a "Docker Compose" resource and give ONLY the
#              kabulcargo_web service the domain (https://transit.kabulcargo.com). Coolify's proxy
#              does TLS and routes to that container's port 80 over Docker's network: this file
#              binds NO host port, so it cannot collide with the Coolify panel (8000), the proxy
#              (80/443) or any other app on the server. Daily backup = a Coolify Scheduled Task.
#              Variables: .env.production.example. Guide (Dari): docs/DEPLOY_COOLIFY.md
#   Plain VPS: docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#              (adds Caddy on 80/443 with Let's Encrypt, and the daily backup service).
#   Local test: scripts/prod_local_test.ps1 (adds docker-compose.local.yml; never on a server).
#
# Every service, volume and network is named kabulcargo_*, and nothing here is shared with other
# apps on the server (own database, own Redis, own volumes). Memory limits: docs/GO_LIVE.md.

name: kabulcargo

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: kabulcargo_backend.settings_production
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  # One domain, read from the environment, never written into the code.
  ALLOWED_HOSTS: ${APP_DOMAIN:?APP_DOMAIN is required}
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
  CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN}
  ADMIN_URL: ${ADMIN_URL:?ADMIN_URL is required}
  DB_NAME: ${DB_NAME:-kabulcargo}
  DB_USER: ${DB_USER:-kabulcargo}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: kabulcargo_db
  DB_PORT: "3306"
  REDIS_URL: redis://kabulcargo_redis:6379/0
  # TLS proxy (Coolify / Caddy) → nginx → gunicorn: two hops.
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-2}
  DOCUMENT_X_ACCEL_PREFIX: /protected-media
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
  LOGIN_FAILURE_RATE: ${LOGIN_FAILURE_RATE:-20/m}
  THROTTLE_ANON_RATE: ${THROTTLE_ANON_RATE:-60/minute}
  THROTTLE_USER_RATE: ${THROTTLE_USER_RATE:-100/minute}
  KC_LOCAL_HTTP_TEST: ${KC_LOCAL_HTTP_TEST:-false}

services:
  kabulcargo_db:
    build:
      context: .
      dockerfile: deploy/mysql/Dockerfile
    image: kabulcargo-db:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      # Small-server tuning: the whole database fits in the buffer pool for years; the
      # performance schema alone would take ~200 MB of RAM.
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=60
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-kabulcargo}
      MYSQL_USER: ${DB_USER:-kabulcargo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Kabul
    volumes:
      - kabulcargo_mysql_data:/var/lib/mysql
    networks: [kabulcargo_net]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  kabulcargo_redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Only throttle / rate-limit counters, shared by all gunicorn workers: nothing to persist.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [kabulcargo_net]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  kabulcargo_backend:
    build: .
    image: kabulcargo-backend:latest
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      kabulcargo_db: { condition: service_healthy }
      kabulcargo_redis: { condition: service_healthy }
    volumes:
      - kabulcargo_media:/app/media
      - kabulcargo_logs:/app/logs
      - kabulcargo_backups:/app/backups
      - kabulcargo_static:/srv/static
    networks: [kabulcargo_net]
    mem_limit: 768m
    logging: *logging

  kabulcargo_web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: kabulcargo-web:latest
    restart: unless-stopped
    environment:
      ADMIN_URL: ${ADMIN_URL:?ADMIN_URL is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    depends_on:
      kabulcargo_backend: { condition: service_healthy }
    volumes:
      - kabulcargo_media:/srv/media:ro
      - kabulcargo_static:/srv/static:ro
    # Coolify's proxy reaches this port over Docker's network; no host port is published.
    expose: ["80"]
    networks: [kabulcargo_net]
    mem_limit: 128m
    # The whole chain: nginx → gunicorn → /api/health/ (database + cache; answers only "ok").
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Host: $$APP_DOMAIN\" --header 'X-Forwarded-Proto: https' http://127.0.0.1/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

networks:
  kabulcargo_net:

volumes:
  kabulcargo_mysql_data:
  kabulcargo_media:
  kabulcargo_logs:
  kabulcargo_backups:
  kabulcargo_static:
