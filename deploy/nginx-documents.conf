# Kabul Cargo — serving uploaded documents in production (include in the server { } block).
#
# Document files must never be public: Django checks the login and the branch at
#   GET /api/documents/<id>/download/
# and answers with  X-Accel-Redirect: /protected-media/<file path>
# (settings_production.DOCUMENT_X_ACCEL_PREFIX). nginx then sends the file itself.

# Only reachable through X-Accel-Redirect from Django, never from a browser URL.
location /protected-media/ {
    internal;
    alias /srv/kabulcargo/media/;          # = MEDIA_ROOT, with the trailing slash
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
}

# The raw media folder is not served at all (an old /media/... link gets 404).
location /media/ {
    return 404;
}
