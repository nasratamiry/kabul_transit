# Same headers Django sends with its own responses (settings.py / settings_production.py), for
# what nginx serves itself: the app's HTML and files. Included in every location that serves
# files, because an add_header inside a location replaces all inherited ones.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $kc_hsts always;   # empty (= not sent) over plain HTTP
# Django's policy, plus Google Fonts (Vazirmatn / Inter) for the React app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
