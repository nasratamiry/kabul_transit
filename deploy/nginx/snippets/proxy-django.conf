proxy_pass http://django;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Appends the address nginx saw; Django trusts TRUSTED_PROXY_COUNT hops from the right.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $kc_proto;
proxy_read_timeout 120s;   # Excel exports of a long period
proxy_send_timeout 120s;
