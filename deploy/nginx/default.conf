# Kabul Cargo — nginx inside docker-compose. TLS ends one step earlier (Caddy on a plain VPS,
# Traefik on Coolify); that proxy sends X-Forwarded-Proto, which is passed on to Django.

map $http_x_forwarded_proto $kc_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $kc_proto $kc_hsts {
    https   "max-age=31536000; includeSubDomains; preload";
    default "";
}

upstream django {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 12m;   # documents: Django allows 10 MB, plus the multipart overhead

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django: API and admin panel (Django sets its own security headers there).
    location /api/   { include /etc/nginx/snippets/proxy-django.conf; }
    location /admin/ { include /etc/nginx/snippets/proxy-django.conf; }

    # Django's collected static files (admin panel), copied to the shared volume at backend start.
    location /static/ {
        alias /srv/static/;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Document files: Django checks login and branch at /api/documents/<id>/download/ and answers
    # with X-Accel-Redirect: /protected-media/<path>. Never reachable from a browser URL.
    location /protected-media/ {
        internal;
        alias /srv/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }
    # The raw media folder is not served at all.
    location /media/ {
        return 404;
    }

    # The React app's hashed bundles never change: cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else is the single-page app: unknown paths get index.html (history routing),
    # which is never cached, so a new release is picked up on the next page load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
